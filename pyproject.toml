[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-doc-summarizer"
version = "0.1.0"
description = "Create source-faithful Markdown summaries from local documents and clipped web articles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tuckn" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
tkn-doc-summarizer = "doc_summarizer.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pytest>=8.4",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_summarizer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["doc_summarizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
