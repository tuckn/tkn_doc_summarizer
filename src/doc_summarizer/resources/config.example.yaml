schema_version: "2.0.0"

# URL inputs are resolved to Markdown files by recursively searching these roots.
# File-path inputs do not require source_roots.
source_roots:
  - 'C:\Users\ExampleUser\Documents\Obsidian\WebClips'

output_root: ~/.tkn/doc_summarizer/data/summaries
reports_root: ~/.tkn/doc_summarizer/state/reports

max_input_bytes: 2000000
max_total_input_bytes: 8000000

# Frontmatter local source path format: native or file-uri.
source_path_format: native

generation:
  # Connection/model/authentication remain in ~/.tkn/genai_bridge/config.yaml.
  # --profile selects an application profile in the current mode's group.
  # bridge_profile: null (or omitted) follows Bridge's default_profile.
  summary:  # summarize --mode series (one or multiple sources).
    default_profile: default
    profiles:
      default:
        bridge_profile: null
        summary_profile: default-ja
      conversation:
        bridge_profile: null
        summary_profile: conversation-ja
      # Define claude-default in Bridge before selecting this profile.
      # meeting:
      #   bridge_profile: claude-default
      #   summary_profile: meeting-minutes-ja
      #   overrides:
      #     timeout_seconds: 1800
  comparison:  # summarize --mode compare.
    default_profile: default
    profiles:
      default:
        bridge_profile: null
        comparison_profile: compare-ja
      claims:
        bridge_profile: null
        comparison_profile: claims-ja

# null uses the selected profile's packaged prompt. A filename is resolved below
# ~/.tkn/doc_summarizer/prompts/. Use an absolute path for other locations.
# Create a custom prompt with: tkn-doc-summarizer prompt init
summary_prompt: null
